name: Validate data
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate CSV and rebuild JSON
        run: python scripts/build_data.py
      - name: Make sure journals.json was committed up to date
        run: git diff --exit-code public/journals.json || (echo "Run 'python scripts/build_data.py' and commit public/journals.json" && exit 1)
